<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyStudy - ホーム</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <a href="home.html" class="logo" style="text-decoration: none; color: inherit;">📘 MyStudy</a>
    <div class="header-actions">
      <a href="timetable.html" class="header-icon" title="時間割" aria-label="時間割">▦</a>
      <a href="settings.html#timezone-settings" class="header-icon" title="設定" aria-label="設定">⚙</a>
      <div class="menu-button" onclick="toggleMenu()">☰</div>
    </div>
  </header>

  <nav id="dropdown-menu" class="menu"></nav>

  <main>
    <div class="card" id="current-class" style="display:none;"></div>

    <div class="card">
      <h2>今日の予定</h2>
      <ul id="today-list"></ul>
      <p id="empty-today" style="display:none; color: #777;">📭 今日の予定はありません</p>
    </div>

    <div class="card">
      <h2>今後の予定を登録</h2>
      <select id="entryType">
        <option value="todo">ToDo</option>
        <option value="event">イベント</option>
      </select>
      <input type="text" id="entryTitle" placeholder="タイトル">
      <input type="date" id="entryDate">
      <input type="time" id="entryTime">
      <input type="text" id="entryMemo" placeholder="メモ（任意）">
      <button onclick="addEntry()">登録</button>
    </div>

    <div class="card">
      <h2>教科一覧</h2>
      <ul id="class-list"></ul>
      <button onclick="addClass()">＋教科を追加</button>
    </div>
  </main>

  <footer class="bottom-nav">
    <a href="home.html">🏠</a>
    <a href="todo.html">🕒</a>
    <a href="#" onclick="addClass()">➕</a>
  </footer>

  <script src="utils.js"></script>
  <script>
    injectEditModal();
    injectClassEditModal();

    function deleteClass(classId) {
      const relatedTodos = readStoredList("todos").filter(t => t.classId === classId).length;
      const relatedEvents = readStoredList("events").filter(e => e.classId === classId).length;
      const message = relatedTodos + relatedEvents > 0
        ? `本当に削除しますか？\n関連するToDo ${relatedTodos}件、イベント ${relatedEvents}件も削除されます。`
        : "本当に削除しますか？";
      if (!confirm(message)) return;

      try {
        const classes = readStoredListStrict("classes");
        const todos = readStoredListStrict("todos");
        const events = readStoredListStrict("events");
        createBackup(relatedTodos + relatedEvents > 0 ? "delete-class-with-entries" : "delete-class");
        writeStoredList("classes", classes.filter(c => c.id !== classId));
        writeStoredList("todos", todos.filter(t => t.classId !== classId));
        writeStoredList("events", events.filter(e => e.classId !== classId));
        location.reload();
      } catch (error) {
        alert(error.message || "教科の削除に失敗しました。");
      }
    }

    function loadPage() {
      const classes = readStoredList("classes");
      const cleaned = cleanExpiredEntries();
      let todos = cleaned.todos;
      let events = cleaned.events;

      const today = getTodayString();

      // 今の時間に近い教科
      const schedule = getPeriodSchedules();
      const currentBox = document.getElementById("current-class");
      const nowMin = getCurrentMinutesOfDay();
      const currentWeekday = getCurrentWeekday();
      const currentSubjects = classes
      .filter(c => {
        const dur = c.duration || 1;
        for (let i = 0; i < dur; i++) {
          const periodIndex = c.period - 1 + i;
          const range = schedule[periodIndex];
          if (!range) continue;
          if (range.startMin === null || range.endMin === null) continue;
          if (nowMin >= range.startMin - 90 && nowMin <= range.endMin + 90) {
            return c.weekday === currentWeekday;
          }
        }
        return false;
      })
      .map(c => {
        const periodIndex = c.period - 1;
        const range = schedule[periodIndex];
        const center = range && range.startMin !== null && range.endMin !== null
          ? (range.startMin + range.endMin) / 2
          : nowMin;
        const dist = Math.abs(nowMin - center);
        return { ...c, _dist: dist }; // 距離付きで拡張
      })
      .sort((a, b) => a._dist - b._dist); // 近い順に並べる

      if (currentSubjects.length > 0) {
        currentBox.style.display = "block";
        currentBox.replaceChildren();
        const heading = document.createElement("h2");
        heading.textContent = "📘 今の時間に近い教科";
        currentBox.appendChild(heading);
        currentSubjects.forEach(c => {
          const p = document.createElement("p");
          const a = document.createElement("a");
          const roomText = c.room ? ` @${c.room}` : "";
          const duration = c.duration || 1;
          const periodText = duration === 2 ? `${c.period},${c.period + 1}限` : `${c.period}限`;
          a.href = getSubjectUrl(c.id);
          a.textContent = `${c.subject}（${['月','火','水','木','金','土'][c.weekday - 1]}${periodText}${roomText}）`;
          p.appendChild(a);
          currentBox.appendChild(p);
        });
      }

      // 今日の予定 (ToDo + イベント) を時刻順に
      const todayList = document.getElementById("today-list");
      const emptyToday = document.getElementById("empty-today");
      todayList.replaceChildren();

      const entries = [];

      todos.filter(t => t.due === today && !t.done).forEach(t => {
        const subject = classes.find(c => c.id === t.classId)?.subject || "";
        entries.push({
          id: t.id,
          type: "todo",
          iso: getDateTime(t.due, t.time).getTime(),
          dateStr: formatEntryDate(t.due, t.time),
          label: t.content,
          memo: t.memo,
          subject
        });
      });

      events.filter(e => e.date === today).forEach(e => {
        const subject = classes.find(c => c.id === e.classId)?.subject || "";
        entries.push({
          id: e.id,
          type: "event",
          iso: getDateTime(e.date, e.time).getTime(),
          dateStr: formatEntryDate(e.date, e.time),
          label: e.title,
          memo: e.memo,
          subject
        });
      });

      // 時刻順ソート
      entries.sort((a, b) => a.iso - b.iso);

      if (entries.length === 0) {
        emptyToday.style.display = "block";
      } else {
        emptyToday.style.display = "none";
        entries.forEach(e => {
          const li = document.createElement("li");
          li.className = "item";
          appendEntrySummary(li, e);

          if (e.type === "todo") {
            const doneBtn = document.createElement("button");
            doneBtn.textContent = "完了";
            doneBtn.onclick = () => toggleTodoDone(e.id);
            li.appendChild(doneBtn);
          }

          const editBtn = document.createElement("button");
          editBtn.textContent = "編集";
          editBtn.onclick = () => openEditModal(e.type, e.id);

          const deleteBtn = document.createElement("button");
          deleteBtn.textContent = "削除";
          deleteBtn.onclick = () => deleteEntry(e.type, e.id);

          li.appendChild(editBtn);
          li.appendChild(deleteBtn);
          todayList.appendChild(li);
        });
      }

      // 教科一覧はそのまま
      const classList = document.getElementById("class-list");
      classList.replaceChildren();
      classes.sort((a, b) => a.weekday - b.weekday || a.period - b.period);
      classes.forEach(c => {
        const li = document.createElement("li");
        li.className = "class-item";
        li.style.display = "grid";
        li.style.gridTemplateColumns = "1fr auto";
        li.style.alignItems = "center";
        li.style.columnGap = "8px";

        const duration = c.duration || 1;
        const room = c.room ? ` @${c.room}` : "";
        const periodText = duration === 2 ? `${c.period},${c.period + 1}限` : `${c.period}限`;
        const weekdayText = ['月','火','水','木','金','土'][c.weekday - 1];

        const span = document.createElement("span");
        span.textContent = `${c.subject}（${weekdayText}${periodText}${room}）`;
        span.style.cursor = "pointer";
        span.style.textDecoration = "underline";
        span.onclick = () => location.href = getSubjectUrl(c.id);

        const buttons = document.createElement("div");
        buttons.style.display = "flex";
        buttons.style.gap = "0";

        const editBtn = document.createElement("button");
        editBtn.textContent = "編集";
        editBtn.onclick = () => openClassEditModal(c);

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "削除";
        deleteBtn.onclick = () => deleteClass(c.id);

        buttons.appendChild(editBtn);
        buttons.appendChild(deleteBtn);

        li.appendChild(span);
        li.appendChild(buttons);
        classList.appendChild(li);
      });
    }
    document.addEventListener('DOMContentLoaded', loadPage);
  </script>
</body>
</html>
